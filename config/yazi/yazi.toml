[mgr]
linemode = "mtime_ls"
show_hidden = true
[preview]
max_width  = 2400
max_height = 3600
image_quality = 90

[opener]
shw = [{ run = 'shw "$@"', block = true, desc = "shw" }]

[open]
prepend_rules = [
	{ mime = "image/*", use = ["shw", "open"] },
	{ mime = "video/*", use = ["shw", "open"] },
	{ name = "*.md", use = ["shw", "edit"] },
]
