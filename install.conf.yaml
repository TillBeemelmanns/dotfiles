- defaults:
    link:
        relink: true
        create: true
    clean:
        recursive: true
    shell:
        stdout: true
        stderr: true

- clean:
    '~':
        recursive: false
    '~/.config':
        recursive: false
    '~/.local/bin':

- shell:
    - command: bash scripts/install-bat.sh
      description: Install latest bat
    - command: bash scripts/install-delta.sh
      description: Install latest delta
    - command: bash scripts/install-lazygit.sh
      description: Install latest lazygit
    - command: bash scripts/install-turm.sh
      description: Install latest turm
    - command: bash scripts/install-yazi.sh
      description: Install latest yazi
    - command: '[ -L ~/.config/ghostty ] && rm ~/.config/ghostty || true'
      description: Remove ghostty directory symlink to allow individual file linking

- link:
    ~/.config/lazygit:
        path: config/lazygit
    ~/.config/pip:
        path: config/pip
    ~/.config/yazi:
        path: config/yazi

    ~/.config/ghostty/themes:
        path: config/ghostty/themes

    ~/.claude/settings.json:
        path: config/claude/settings.json
    ~/.claude/statusline-command.sh:
        path: config/claude/statusline-command.sh

    ~/:
        glob: true
        path: home/*
        prefix: '.'

- link:
    ~/.config/ghostty/config:
        if: '[ `uname` = Darwin ]'
        path: config/ghostty/config_darwin

- link:
    ~/.config/ghostty/config:
        if: '[ `uname` = Linux ]'
        path: config/ghostty/config_linux

# ULHPC cluster only
- link:
    ~/.config/ulhpc:
        if: 'hostname -f 2>/dev/null | grep -q "\.uni\.lux$"'
        path: config/ulhpc
    ~/.bashrc.local:
        if: 'hostname -f 2>/dev/null | grep -q "\.uni\.lux$"'
        path: config/ulhpc/rc.sh
    ~/.zshrc.local:
        if: 'hostname -f 2>/dev/null | grep -q "\.uni\.lux$"'
        path: config/ulhpc/rc.sh
    ~/.local/bin/gpus:
        if: 'hostname -f 2>/dev/null | grep -q "\.uni\.lux$"'
        path: config/ulhpc/gpus
